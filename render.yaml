# Free-tier deployment: Vercel hosts the React SPA; Render hosts API + worker together.
# MongoDB Atlas, object storage (S3/R2) and SMTP are external services.
services:
  - type: web
    name: arihant-workspace-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: arihant-workspace-shared
      - key: PORT
        value: '4000'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arihant-workspace-redis
          property: connectionString

  - type: keyvalue
    name: arihant-workspace-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

envVarGroups:
  - name: arihant-workspace-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ORG_TIMEZONE
        value: Asia/Kolkata
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITLAB_WEBHOOK_SECRET
        sync: false
      - key: BITBUCKET_WEBHOOK_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_PROVIDER_NAME
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
